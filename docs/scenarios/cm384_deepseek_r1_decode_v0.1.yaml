revision: 2
parameter_resolution:
  independent_of_v03: true
  choose_or_retrieve_now:
  - 场景范围、访问方式与事务 profile、模型与放置、通信行为抽象
  - 按锁定后端选定链路、路由、队列、流控、分段与端点资源参数
  - 通信源码/文献版本与数据访问、trace manifest
  - 参考局部耗时与 KV/工作区预算；无实测时声明参考范围
  derive_from_selected_inputs:
  - 每 Token 向量字节、逐专家贡献、逐源目的流量、消息分块
  - 真实 prompt 长度、实际可用 decode 步、文件校验值
  verify_when_implemented:
  - 配置真正贯穿计划、事务生成、执行完成和观测
  - 128-rank、多请求、多层与观察窗口的联合执行
  - 新事务 profile 的就绪/完成、回收和包字节归属
  hardware_calibration_is_separate: true
  hardware_calibration_required_for: 声称复现真实硬件绝对时延或容量极限时
  reference_experiments_allowed_after: 当前 profile 参数完整且功能/因果/观测验证通过后
  not_required_for_this_study:
  - 逐指令 AIV/MTE 仿真
  - 寄存器和片内缓存微结构
  - 芯片内 die 互联协议
ns3_backend:
  basis: selected_reference
  repository: https://github.com/baoy21/ns-3-ub
  revision: ffb178144635b724e6960887b470884e3d6e330f
  configuration_is_current_cli_schema: false
  source:
  - ns3_ub_datatype
  - ns3_ub_function
  - joint_m2_network
  - joint_current_task
  one_shared_ns3_instance_and_clock: true
  time_resolution_ns: 1
  transaction_profile_for_bringup: urma_write_rtp_reference
  transaction_profiles:
    urma_write_rtp_reference:
      programming_model: URMA
      operation: WRITE
      transport: RTP
      initiator: data_owner
      payload_direction: initiator_to_target
      joint_support: implemented_for_existing_reference_cases
      receiver_ready: RemoteWriteCommitted
      sender_release: transaction_done_callback
      cann_native_transaction_equivalence: not_claimed
    urma_read_rtp_candidate:
      programming_model: URMA
      operation: READ
      transport: RTP
      initiator: data_consumer
      payload_direction: target_to_initiator
      joint_support: adapter_completion_and_observation_pending
    urma_ctp_candidates:
      programming_model: URMA
      operations:
      - READ
      - WRITE
      transport: CTP
      joint_support: not_integrated
      select_only_if_required_by_experiment: true
    native_ldst_candidates:
      programming_model: native_LDST
      operations:
      - MEM_LOAD
      - MEM_STORE
      wire_packet_class: PACKET_UB_MEM
      transport_mode_attribute_applies: false
      MEM_LOAD_initiator: data_consumer
      MEM_STORE_initiator: data_owner
      joint_support: adapter_completion_and_observation_pending
      qualification_zh: 锁定实现的 UbApp::TransportMode 用于 URMA RTP/CTP；MEM_LOAD/STORE 走独立 UbLdstApi 路径，不应标成 LDST+CTP。
      MEM_LOAD_completion: 完整响应数据可供发起端消费；joint 事件映射待接入验证。
      MEM_STORE_completion: 区分远端数据可消费与反向事务 ACK；joint 事件映射待接入验证。
  transaction_selection_scope: 按传输角色选择操作；数据和元数据允许采用不同 profile，不能只用一个全局 read/write 开关。
  reference_attributes:
    ns3::UbSwitch::FlowControl: CBFC
    ns3::UbSwitch::VlScheduler: SP
    ns3::UbRoutingProcess::RoutingAlgorithm: HASH
    ns3::UbApp::EnableMultiPath: false
    ns3::UbApp::UseShortestPaths: true
    ns3::UbApp::UsePacketSpray: false
    ns3::UbTransportChannel::UsePacketSpray: false
    ns3::UbTransportChannel::UseShortestPaths: true
    ns3::UbJetty::TaSegmentBytes: 65536
    ns3::UbJetty::UbJettyInflightMax: 10000
    ns3::UbTransportChannel::DefaultMaxWqeSegNum: 1000
    ns3::UbTransportChannel::DefaultMaxInflightPacketSize: 1000
    ns3::UbTransportChannel::EnableRetrans: false
    ns3::UbPort::UbInterframeGap: 0ns
    ns3::UbPort::CbfcFlitLenByte: 20
    ns3::UbPort::CbfcFlitsPerCell: 8
    ns3::UbPort::CbfcRetCellGrainDataPacket: 4
    ns3::UbPort::CbfcRetCellGrainControlPacket: 32
    ns3::UbPort::CbfcCtrlCrdRtrThldCell: 1024
    ns3::UbPort::CbfcInitCreditCell: 6553
    ns3::UbQueueManager::ReservePerQueueBytes: 1048576
    ns3::UbQueueManager::SharedPoolBytes: 0
    ns3::UbQueueManager::HeadroomPerPortBytes: 0
    ns3::UbQueueManager::AlphaShift: 1
    ns3::UbEgressQueue::MaxEgressBytes: 524288
    ns3::UbJetty::JettyOooAckThreshold: 2048
  reference_globals:
    UB_CC_ENABLED: false
    UB_CC_ALGO: CAQM
    UB_FAULT_ENABLE: false
    UB_PRIORITY_NUM: 16
    UB_VL_NUM: 16
  inactive_settings_zh: 关闭 CC 时 CAQM 算法名不表示其在运行；关闭故障与重传不表示完成了相关模式验收。
  packetization:
    collective_chunk_bytes: 8192
    ta_segment_bytes: 65536
    tp_max_data_payload_bytes: 4096
    tp_payload_size_source: UB_MTU_BYTE_compile_time_constant
    tp_payload_size_runtime_configurable_in_current_revision: false
    qualification_zh: 集合分块、TA 分段、TP 包载荷分别记录；URMA/RTP 的数值不能自动套给 native LD/ST。
  native_ldst_reference_parameters:
    enabled: false
    ns3::UbLdstInstance::ThreadNum: 10
    ns3::UbLdstThread::LoadRequestSize: 64
    ns3::UbLdstThread::LoadResponseSize: 512
    ns3::UbLdstThread::StoreRequestSize: 512
    ns3::UbLdstThread::LoadOutstanding: 64
    ns3::UbLdstThread::StoreOutstanding: 64
    basis: selected_reference_from_m2_fixture
    ThreadNum_qualification: m2 样例显式取 10，源码默认 48；UbApp 当前每项任务只传线程 0、1，不能将实例线程数直接等同于任务并发。
  topology_overrides:
    ub_link_rate_bits_per_second_per_direction: 224000000000
    source: fabric.bandwidth.die_ub_port_bits_per_second
    per_link_delay: fabric.reference_timing
    per_switch_allocation_delay: fabric.reference_timing
    precedence: 最终节点/链路覆盖值必须写入 resolved config，不能只记录 TypeId 缺省值。
  transport_channel_setup: precreated
  on_demand_channel_status: 原生后端支持不等于联合观测已接入；当前 joint 依赖预先存在的通道与来源挂点。
  routing_qualification_zh: 当前参考选择 HASH/最短路且关闭 packet spray；它不是 CM384 原部署路由结论。改为多平面喷洒应单独记录路径表、channel 创建和最终生效开关并验证观测。
  must_verify_on_new_profile:
  - read/write 请求发起者、数据方向与最终可消费事件
  - 控制包、数据包和重传的实际字节与归属
  - 当前仅面向 RTP WRITE/ACK 的观测解析扩展
  - 事务完成与端点/发送槽回收
  reference_attribute_origin: 沿用已核对的 m2 network_attribute 输入；该文件未显式设置的 SP、HASH、SharedPool/Headroom/egress 等项取锁定后端源码默认。均为参考设置。
  routing_attribute_semantics:
    EnableMultiPath: 绑定多个候选源端口的 TP 给 Jetty
    UbTransportChannel_UsePacketSpray: RTP 在已有候选路由间逐包选择
    UbApp_UsePacketSpray: 锁定版本传给 CTP service，不控制 RTP spray
    physical_planes: 由外部拓扑与路由/通道表提供，开关本身不产生多平面
observation:
  basis: selected_reference
  counter_location: external_switch_egress_packet_start
  network_scope: inter_chip_scaleup_ports_only
  sampling_period_ns: 1000
  window_interval: half_open
  window_end: primary_decode_observation_window_end
  clock_resolution_ns: 1
  baseline_clock_offset_ns: 0
  baseline_clock_drift_ppb: 0
  clock_model_qualification: 首版参考时钟；跨设备偏移/漂移实验使用独立配置。
  observed_switch_port_selector: explicit_list_derived_from_target_topology
  record_provenance: true
  provenance_is_input_to_mapping_algorithm: false
  byte_counters:
  - wire_packet_bytes
  - control_bytes
  - unique_payload_bytes
  rng_seed: 1
  rng_run: 1
  scale_and_window_limit_verification: v0.3 需验证目标端口数和窗口数；当前小样例的校验上限不表示目标案例已支持。
