<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc">
  <title id="title">Block 24 duration comparison</title>
  <desc id="desc">三类 collective 和整个 Block 24 的重建时间与 ns-3 组合时间比较。</desc>
  <rect width="1280" height="610" fill="#ffffff"/>
  <style>
    text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #18212f; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #5f6b7a; }
    .axis { font-size: 12px; fill: #5f6b7a; }
    .label { font-size: 13px; }
    .value { font-size: 13px; font-weight: 700; }
    .small { font-size: 11px; fill: #5f6b7a; }
    .grid { stroke: #d9e0e8; stroke-width: 1; }
  </style>
  <text x="60" y="42" class="title">重建时间与 ns-3 组合时间：同一阶段，不同模型口径</text><text x="60" y="67" class="subtitle">橙色为 TTFT residual + 16 GB/s/20 μs ring 重建；蓝色为 400 Gbps ns-3 task completion（Block 还组合了相同 GPU profile）。</text><line x1="105" y1="475.00" x2="1195" y2="475.00" class="grid"/><text x="93" y="479.00" text-anchor="end" class="axis">0</text><line x1="105" y1="422.86" x2="1195" y2="422.86" class="grid"/><text x="93" y="426.86" text-anchor="end" class="axis">100</text><line x1="105" y1="370.71" x2="1195" y2="370.71" class="grid"/><text x="93" y="374.71" text-anchor="end" class="axis">200</text><line x1="105" y1="318.57" x2="1195" y2="318.57" class="grid"/><text x="93" y="322.57" text-anchor="end" class="axis">300</text><line x1="105" y1="266.43" x2="1195" y2="266.43" class="grid"/><text x="93" y="270.43" text-anchor="end" class="axis">400</text><line x1="105" y1="214.29" x2="1195" y2="214.29" class="grid"/><text x="93" y="218.29" text-anchor="end" class="axis">500</text><line x1="105" y1="162.14" x2="1195" y2="162.14" class="grid"/><text x="93" y="166.14" text-anchor="end" class="axis">600</text><line x1="105" y1="110.00" x2="1195" y2="110.00" class="grid"/><text x="93" y="114.00" text-anchor="end" class="axis">700</text><rect x="189.25" y="437.97" width="48" height="37.03" fill="#d97706"/><text x="213.25" y="429.97" text-anchor="middle" class="value">71.020</text><rect x="253.25" y="468.58" width="48" height="6.42" fill="#2563eb"/><text x="277.25" y="460.58" text-anchor="middle" class="value">12.304</text><text x="241.25" y="505" text-anchor="middle" class="label">AllReduce</text><rect x="461.75" y="455.96" width="48" height="19.04" fill="#d97706"/><text x="485.75" y="447.96" text-anchor="middle" class="value">36.510</text><rect x="525.75" y="471.60" width="48" height="3.40" fill="#2563eb"/><text x="549.75" y="463.60" text-anchor="middle" class="value">6.527</text><text x="513.75" y="505" text-anchor="middle" class="label">AllGather</text><rect x="734.25" y="456.48" width="48" height="18.52" fill="#d97706"/><text x="758.25" y="448.48" text-anchor="middle" class="value">35.510</text><rect x="798.25" y="471.79" width="48" height="3.21" fill="#2563eb"/><text x="822.25" y="463.79" text-anchor="middle" class="value">6.153</text><text x="786.25" y="505" text-anchor="middle" class="label">ReduceScatter</text><rect x="1006.75" y="141.99" width="48" height="333.01" fill="#d97706"/><text x="1030.75" y="133.99" text-anchor="middle" class="value">638.656</text><rect x="1070.75" y="203.52" width="48" height="271.48" fill="#2563eb"/><text x="1094.75" y="195.52" text-anchor="middle" class="value">520.639</text><text x="1058.75" y="505" text-anchor="middle" class="label">Block 24</text><text x="30" y="300" transform="rotate(-90 30 300)" class="axis">duration (μs)</text><rect x="105" y="545" width="14" height="14" fill="#d97706"/><text x="128" y="557" class="small">LLMServingSim reconstructed</text><rect x="355" y="545" width="14" height="14" fill="#2563eb"/><text x="378" y="557" class="small">ns-3 simulated / composed</text><text x="705" y="557" class="small">差值来自带宽/latency/transport 模型选择，不是硬件误差。</text>
</svg>
