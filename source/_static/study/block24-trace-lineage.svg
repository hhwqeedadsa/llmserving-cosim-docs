<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 560" role="img" aria-labelledby="title desc">
  <title id="title">Block 24 trace lineage</title>
  <desc id="desc">从 LLMServingSim trace 到 ns-3 task、packet、queue 和 port 证据的数据血缘。</desc>
  <rect width="1460" height="560" fill="#ffffff"/>
  <style>
    text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #18212f; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #5f6b7a; }
    .axis { font-size: 12px; fill: #5f6b7a; }
    .label { font-size: 13px; }
    .value { font-size: 13px; font-weight: 700; }
    .small { font-size: 11px; fill: #5f6b7a; }
    .grid { stroke: #d9e0e8; stroke-width: 1; }
  </style>
  <text x="60" y="42" class="title">Block 24 trace 怎样变成 ns-3 的真实场景流</text><text x="60" y="67" class="subtitle">每一步保留稳定 ID 和 evidence label；蓝色字段是语义，紫色字段是结构展开，绿色字段是 ns-3 时间证据。</text><rect x="55" y="130" width="205" height="105" rx="8" fill="#dbeafe"/><rect x="55" y="130" width="6" height="105" rx="3" fill="#2563eb"/><text x="75" y="172" class="value">LLMServingSim trace</text><text x="75" y="202" class="label">op · bytes · profile latency</text><rect x="305" y="130" width="205" height="105" rx="8" fill="#dbeafe"/><rect x="305" y="130" width="6" height="105" rx="3" fill="#2563eb"/><text x="325" y="172" class="value">Block 24 slice</text><text x="325" y="202" class="label">request · batch · block</text><rect x="555" y="130" width="205" height="105" rx="8" fill="#ede9fe"/><rect x="555" y="130" width="6" height="105" rx="3" fill="#7c3aed"/><text x="575" y="172" class="value">2-rank ring projection</text><text x="575" y="202" class="label">stage · src · dst · bytes</text><rect x="805" y="130" width="205" height="105" rx="8" fill="#ede9fe"/><rect x="805" y="130" width="6" height="105" rx="3" fill="#7c3aed"/><text x="825" y="172" class="value">ns-3 traffic.csv</text><text x="825" y="202" class="label">phase · dependency · delay</text><rect x="1055" y="130" width="205" height="105" rx="8" fill="#d1fae5"/><rect x="1055" y="130" width="6" height="105" rx="3" fill="#059669"/><text x="1075" y="172" class="value">Task trace</text><text x="1075" y="202" class="label">start · complete · FCT</text><rect x="1055" y="345" width="205" height="105" rx="8" fill="#d1fae5"/><rect x="1055" y="345" width="6" height="105" rx="3" fill="#059669"/><text x="1075" y="387" class="value">Packet / queue / port</text><text x="1075" y="417" class="label">hop time · bytes · occupancy</text><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7b8794"/></marker></defs><line x1="260" y1="182" x2="305" y2="182" stroke="#7b8794" stroke-width="2" marker-end="url(#arr)"/><line x1="510" y1="182" x2="555" y2="182" stroke="#7b8794" stroke-width="2" marker-end="url(#arr)"/><line x1="760" y1="182" x2="805" y2="182" stroke="#7b8794" stroke-width="2" marker-end="url(#arr)"/><line x1="1010" y1="182" x2="1055" y2="182" stroke="#7b8794" stroke-width="2" marker-end="url(#arr)"/><line x1="1158" y1="235" x2="1158" y2="345" stroke="#7b8794" stroke-width="2" marker-end="url(#arr)"/><text x="80" y="305" class="small">collective_id</text><rect x="80" y="320" width="400" height="42" rx="5" fill="#f1f5f9"/><text x="92" y="346" style="font-size:12px;font-weight:700;fill:#2563eb">req0.batch0.block24.moe_allgather</text><text x="510" y="305" class="small">flow_id</text><rect x="510" y="320" width="170" height="42" rx="5" fill="#f1f5f9"/><text x="522" y="346" style="font-size:12px;font-weight:700;fill:#7c3aed">flow4</text><text x="710" y="305" class="small">task_id</text><rect x="710" y="320" width="150" height="42" rx="5" fill="#f1f5f9"/><text x="722" y="346" style="font-size:12px;font-weight:700;fill:#059669">4</text><text x="890" y="305" class="small">packet key</text><rect x="890" y="320" width="365" height="42" rx="5" fill="#f1f5f9"/><text x="902" y="346" style="font-size:12px;font-weight:700;fill:#059669">task 4 / PSN 136…204</text><text x="55" y="505" class="small">边界：源 trace 没有 NCCL backend flow；src/dst 是显式的 2-rank ring projection。ns-3 时间只属于本图配置的 400 Gbps 单交换机。</text>
</svg>
