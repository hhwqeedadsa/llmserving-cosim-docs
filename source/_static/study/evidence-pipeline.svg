<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 470" role="img" aria-labelledby="title desc">
  <title id="title">仿真证据链</title>
  <desc id="desc">SimAI、LLMServingSim、SimCCL 与 ns-3 之间的数据变换和证据类型。</desc>
  <rect width="1320" height="470" fill="#ffffff"/>
  <style>
    text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #18212f; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #5f6b7a; }
    .axis { font-size: 12px; fill: #5f6b7a; }
    .label { font-size: 13px; }
    .value { font-size: 13px; font-weight: 700; }
    .small { font-size: 11px; fill: #5f6b7a; }
    .grid { stroke: #d9e0e8; stroke-width: 1; }
  </style>
  <text x="60" y="42" class="title">从 workload 到逐包 trace：数据和证据不能混级</text><text x="60" y="67" class="subtitle">箭头表示数据变换；标签表示该阶段新增的物理量或结构，不表示实机测量。</text><rect x="55" y="120" width="190" height="94" rx="8" fill="#f1f5f9"/><rect x="55" y="120" width="6" height="94" rx="3" fill="#18212f"/><text x="75" y="157" class="value">Workload / request</text><text x="75" y="185" class="label">layer、bytes、依赖</text><rect x="295" y="120" width="190" height="94" rx="8" fill="#ffedd5"/><rect x="295" y="120" width="6" height="94" rx="3" fill="#d97706"/><text x="315" y="157" class="value">SimAI analytical</text><text x="315" y="185" class="label">compute / comm 时间</text><rect x="535" y="120" width="190" height="94" rx="8" fill="#ede9fe"/><rect x="535" y="120" width="6" height="94" rx="3" fill="#7c3aed"/><text x="555" y="157" class="value">SimCCL</text><text x="555" y="185" class="label">src、dst、payload</text><rect x="775" y="120" width="190" height="94" rx="8" fill="#dbeafe"/><rect x="775" y="120" width="6" height="94" rx="3" fill="#2563eb"/><text x="795" y="157" class="value">ns-3-UB</text><text x="795" y="185" class="label">queue / packet / ACK</text><rect x="1015" y="120" width="250" height="94" rx="8" fill="#d1fae5"/><rect x="1015" y="120" width="6" height="94" rx="3" fill="#059669"/><text x="1035" y="157" class="value">网络观测</text><text x="1035" y="185" class="label">FCT、吞吐、逐跳时间</text><rect x="295" y="302" width="190" height="94" rx="8" fill="#dbeafe"/><rect x="295" y="302" width="6" height="94" rx="3" fill="#2563eb"/><text x="315" y="339" class="value">LLMServingSim</text><text x="315" y="367" class="label">request / batch / TTFT</text><rect x="535" y="302" width="190" height="94" rx="8" fill="#d1fae5"/><rect x="535" y="302" width="6" height="94" rx="3" fill="#059669"/><text x="555" y="339" class="value">Layer profile</text><text x="555" y="367" class="label">GPU layer latency</text><rect x="775" y="302" width="190" height="94" rx="8" fill="#ede9fe"/><rect x="775" y="302" width="6" height="94" rx="3" fill="#7c3aed"/><text x="795" y="339" class="value">统一事件流</text><text x="795" y="367" class="label">GPU / NIC 同轴切片</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7b8794"/></marker></defs><line x1="245" y1="167" x2="295" y2="167" stroke="#7b8794" stroke-width="2" marker-end="url(#arrow)"/><line x1="485" y1="167" x2="535" y2="167" stroke="#7b8794" stroke-width="2" marker-end="url(#arrow)"/><line x1="725" y1="167" x2="775" y2="167" stroke="#7b8794" stroke-width="2" marker-end="url(#arrow)"/><line x1="965" y1="167" x2="1015" y2="167" stroke="#7b8794" stroke-width="2" marker-end="url(#arrow)"/><line x1="245" y1="188" x2="295" y2="327" stroke="#7b8794" stroke-width="2" marker-end="url(#arrow)"/><line x1="485" y1="349" x2="535" y2="349" stroke="#7b8794" stroke-width="2" marker-end="url(#arrow)"/><line x1="725" y1="349" x2="775" y2="349" stroke="#7b8794" stroke-width="2" marker-end="url(#arrow)"/><line x1="870" y1="302" x2="870" y2="214" stroke="#7b8794" stroke-width="2" marker-end="url(#arrow)"/><text x="55" y="442" class="small">证据顺序：scenario input → analytical/profile-derived → structural → simulated；本轮无 measured 网络证据。</text>
</svg>
