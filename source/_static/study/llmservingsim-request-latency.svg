<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
  <title id="title">LLMServingSim 请求级延迟</title>
  <desc id="desc">Dense 与 MoE 场景的 TTFT 和 TPOT。</desc>
  <rect width="1080" height="540" fill="#ffffff"/>
  <style>
    text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #18212f; }
    .title { font-size: 24px; font-weight: 700; }
