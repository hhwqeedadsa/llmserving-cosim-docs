<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 560" role="img" aria-labelledby="title desc">
  <title id="title">ns-3 NIC 吞吐</title>
  <desc id="desc">八个 device NIC 的收发 active-window throughput。</desc>
  <rect width="1220" height="560" fill="#ffffff"/>
  <style>
    text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #18212f; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #5f6b7a; }
    .axis { font-size: 12px; fill: #5f6b7a; }
    .label { font-size: 13px; }
    .value { font-size: 13px; font-weight: 700; }
    .small { font-size: 11px; fill: #5f6b7a; }
    .grid { stroke: #d9e0e8; stroke-width: 1; }
  </style>
  <text x="60" y="42" class="title">ns-3 device NIC 的 active-window throughput</text><text x="60" y="67" class="subtitle">每个点是该 NIC 从首个到最后一个 trace 字节之间的平均线速吞吐；纵轴截断到 394–398 Gbps。</text><line x1="100" y1="440.00" x2="1140" y2="440.00" class="grid"/><text x="88" y="444.00" text-anchor="end" class="axis">394</text><line x1="100" y1="357.50" x2="1140" y2="357.50" class="grid"/><text x="88" y="361.50" text-anchor="end" class="axis">395</text><line x1="100" y1="275.00" x2="1140" y2="275.00" class="grid"/><text x="88" y="279.00" text-anchor="end" class="axis">396</text><line x1="100" y1="192.50" x2="1140" y2="192.50" class="grid"/><text x="88" y="196.50" text-anchor="end" class="axis">397</text><line x1="100" y1="110.00" x2="1140" y2="110.00" class="grid"/><text x="88" y="114.00" text-anchor="end" class="axis">398</text><circle cx="150.00" cy="356.68" r="7" fill="#2563eb"/><text x="150.00" y="344.68" text-anchor="middle" class="small">395.01</text><rect x="173.00" y="136.00" width="14" height="14" fill="#d97706"/><text x="180.00" y="131.00" text-anchor="middle" class="small">397.60</text><text x="165.00" y="468" text-anchor="middle" class="axis">NIC0</text><circle cx="280.00" cy="355.85" r="7" fill="#2563eb"/><text x="280.00" y="343.85" text-anchor="middle" class="small">395.02</text><rect x="303.00" y="211.08" width="14" height="14" fill="#d97706"/><text x="310.00" y="206.08" text-anchor="middle" class="small">396.69</text><text x="295.00" y="468" text-anchor="middle" class="axis">NIC1</text><circle cx="410.00" cy="346.78" r="7" fill="#2563eb"/><text x="410.00" y="334.78" text-anchor="middle" class="small">395.13</text><rect x="433.00" y="350.50" width="14" height="14" fill="#d97706"/><text x="440.00" y="345.50" text-anchor="middle" class="small">395.00</text><text x="425.00" y="468" text-anchor="middle" class="axis">NIC2</text><circle cx="540.00" cy="359.97" r="7" fill="#2563eb"/><text x="540.00" y="347.97" text-anchor="middle" class="small">394.97</text><rect x="563.00" y="383.50" width="14" height="14" fill="#d97706"/><text x="570.00" y="378.50" text-anchor="middle" class="small">394.60</text><text x="555.00" y="468" text-anchor="middle" class="axis">NIC3</text><circle cx="670.00" cy="351.73" r="7" fill="#2563eb"/><text x="670.00" y="339.73" text-anchor="middle" class="small">395.07</text><rect x="693.00" y="167.35" width="14" height="14" fill="#d97706"/><text x="700.00" y="162.35" text-anchor="middle" class="small">397.22</text><text x="685.00" y="468" text-anchor="middle" class="axis">NIC4</text><circle cx="800.00" cy="343.47" r="7" fill="#2563eb"/><text x="800.00" y="331.47" text-anchor="middle" class="small">395.17</text><rect x="823.00" y="242.42" width="14" height="14" fill="#d97706"/><text x="830.00" y="237.42" text-anchor="middle" class="small">396.31</text><text x="815.00" y="468" text-anchor="middle" class="axis">NIC5</text><circle cx="930.00" cy="344.30" r="7" fill="#2563eb"/><text x="930.00" y="332.30" text-anchor="middle" class="small">395.16</text><rect x="953.00" y="278.72" width="14" height="14" fill="#d97706"/><text x="960.00" y="273.72" text-anchor="middle" class="small">395.87</text><text x="945.00" y="468" text-anchor="middle" class="axis">NIC6</text><circle cx="1060.00" cy="313.78" r="7" fill="#2563eb"/><text x="1060.00" y="301.78" text-anchor="middle" class="small">395.53</text><rect x="1083.00" y="387.62" width="14" height="14" fill="#d97706"/><text x="1090.00" y="382.62" text-anchor="middle" class="small">394.55</text><text x="1075.00" y="468" text-anchor="middle" class="axis">NIC7</text><text x="28" y="280" transform="rotate(-90 28 280)" class="axis">active-window throughput (Gbps)</text><circle cx="100" cy="510" r="6" fill="#2563eb"/><text x="114" y="515" class="small">Rx</text><rect x="175" y="504" width="12" height="12" fill="#d97706"/><text x="196" y="515" class="small">Tx</text><text x="355" y="515" class="small">不是固定窗口平均，也不是 GPU 有效 payload goodput；包含 trace 统计口径下的协议字节。</text>
</svg>
