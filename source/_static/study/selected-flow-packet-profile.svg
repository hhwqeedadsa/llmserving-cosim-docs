omplete · 76.51380 μs</text><line x1="1222.18" y1="128" x2="1222.18" y2="435" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5"/><text x="1214.18" y="495" text-anchor="end" style="font-size:12px;font-weight:700;fill:#dc2626">ACK envelope · 76.56952 μs</text><text x="760.0" y="545" text-anchor="middle" class="axis">ns-3 simulation time (μs, split axis)</text><circle cx="210" cy="615" r="6" fill="#2563eb"/><text x="225" y="620" class="small">first 4 KiB packet</text><circle cx="390" cy="615" r="6" fill="#7c3aed"/><text x="405" y="620" class="small">last 4 KiB data packet</text><text x="210" y="655" class="small">WQE completion 与 parser 的 last-packet-ACK envelope 是不同事件源和完成语义；图中分别保留。</text>
